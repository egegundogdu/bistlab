# THYAO değerleme varsayımları. Şirket USD raporladığı için hesap USD yapılır.

[company]
ticker = "THYAO"
currency = "USD"

[market]
usd_risk_free = 0.0418        # ABD 10Y, 1 Ocak 2026 (Damodaran, Data Update 4, 2026)
equity_risk_premium = 0.0889  # Türkiye toplam ERP, USD bazlı (Damodaran ctryprem, Şubat 2026)
us_inflation = 0.025          # varsayım: uzun vadeli ABD enflasyonu

[beta]
use_blume = true

[capital]
pre_tax_cost_of_debt = 0.07   # varsayım: USD borçlanma maliyeti (filo finansmanı dahil)
tax_rate = 0.25

[forecast]
base_fcf_years = 3
growth = [0.07, 0.06, 0.06, 0.05, 0.05]  # varsayım: nominal USD büyüme, 5 yıl
terminal_real_growth = 0.02
