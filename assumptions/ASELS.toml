# ASELS değerleme varsayımları. Her sayı kaynağı ya da "varsayım" notuyla birlikte.

[company]
ticker = "ASELS"
currency = "TRY"

[market]
usd_risk_free = 0.0418        # ABD 10Y, 1 Ocak 2026 (Damodaran, Data Update 4, 2026)
equity_risk_premium = 0.0889  # Türkiye toplam ERP, USD bazlı (Damodaran ctryprem, Şubat 2026)
us_inflation = 0.025          # varsayım: uzun vadeli ABD enflasyonu
local_inflation = 0.20        # varsayım: önümüzdeki yıllar ortalama TR enflasyonu

[beta]
use_blume = true              # ham beta 0,67 × β + 0,33 ile 1'e doğru düzeltilir
# value = 1.0                 # açılırsa hesaplanan beta yerine bu kullanılır

[capital]
pre_tax_cost_of_debt = 0.40   # varsayım: TL kurumsal borçlanma maliyeti
tax_rate = 0.25               # Türkiye kurumlar vergisi oranı

[forecast]
base_fcf_years = 3            # son 3 yılın ortalama serbest nakit akışı baz alınır
growth = [0.30, 0.26, 0.23, 0.21, 0.20]  # varsayım: nominal TL büyüme, 5 yıl
terminal_real_growth = 0.02   # varsayım: uzun vadeli reel büyüme
