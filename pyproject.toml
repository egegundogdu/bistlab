[project]
name = "bistlab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "egegundogdu", email = "egegundogdu35@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
